<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ventas SurOccidente Acumulado</title>
  <link rel="stylesheet" href="../dashboard_ventas_style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<body data-view="acumulado">

  <!-- FLOATING ELEMENTS -->
<div class="floating-balls">
    <div class="ball b1">📈</div>
    <div class="ball b2">🎯</div>
    <div class="ball b3">🏅</div>
    <div class="ball b4">☁️</div>
    <div class="ball b5">🌟</div>
    <div class="ball b6">🚀</div>
  </div>

  <div class="container">

    <!-- HEADER -->
    <header class="hero">
      <div class="hero-left">
        <div class="flag-stack">
          <span>📈</span><span>🎯</span><span>🏅</span>
        </div>
      </div>

      <div class="hero-center">
        <div class="trophy-wrap">
          <span class="trophy-icon">🏆</span>
          <div class="trophy-rays"></div>
        </div>

        <h1 class="title" id="mainTitle"></h1>
        <p class="subtitle">&nbsp; ACUMULADO · H2 - FY27 &nbsp;</p>
      </div>

      <div class="hero-right">
        <div class="flag-stack">
          <span>☁️</span><span>🤖</span><span>🚀</span>
        </div>
      </div>
    </header>

    <!-- NAVEGACIÓN -->
    <div class="executive-summary navigation-home">

      <a href="../index.html" class="summary-navigation-card">
        <div class="summary-title">
          🏠 INICIO
        </div>
        <div>Volver a la portada</div>
      </a>

      <a href="mes.html" class="summary-navigation-card">
        <div class="summary-title">
          📅 MES ACTUAL
        </div>
        <div id="monthSummary"></div>
      </a>

    </div>

    <!-- RESUMEN ACUMULADO -->
    <div class="home-message">
      <h2>Vista acumulada</h2>
      <p>Detalle del cumplimiento acumulado FY27.</p>
    </div>

<!-- TABLA ACUMULADO -->
    <section class="table-section">
      <div id="yearlySubtitle" class="card-subtitle"></div>
      <div class="table-wrapper">
        <table id="yearlyTable">
          <thead>
            <tr>
              <th>Pos</th>
              <th>Comercial</th>
              <th>% Acum.</th>
              <th>Cuota Acum.</th>
              <th>Utilidad Acum.</th>
              <th>Gap</th>
            </tr>
          </thead>
          <tbody id="yearlyTableBody"></tbody>
        </table>
      </div>
    </section>

    <footer class="footer">
      <span> Informe de ventas · Powered by Mario Arango · 2026 </span>
    </footer>

  </div>

  <script src="../dashboard_ventas.js"></script>
</body>
</html>
